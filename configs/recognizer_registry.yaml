      - nl
    type: predefined
  - name: CryptoRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: DateRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: EmailRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: IbanRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: IpRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: PhoneRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: UrlRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: MacAddressRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: UsSsnRecognizer
    supported_languages:
      - en
    type: predefined
  - name: UsBankRecognizer
    supported_languages:
      - en
    type: predefined
  - name: UsPassportRecognizer
    supported_languages:
      - en
    type: predefined
  - name: UsLicenseRecognizer
    supported_languages:
      - en
    type: predefined
  - name: MedicalLicenseRecognizer
    supported_languages:
      - en
    type: predefined
  - name: NhsRecognizer
    supported_languages:
      - en
    type: predefined
  - name: UsItinRecognizer
    supported_languages:
      - en
    type: predefined
  - name: LooseSsnRecognizer
    type: custom
    enabled: true
    supported_entity: US_SSN
    patterns:
      - name: ssn_dashed
        regex: "(\\b\\d{3}-\\d{2}-\\d{4}\\b)"
        score: 0.6
    supported_languages:
      - language: en
        context: [ssn, social, identification, identifier]
      - language: nl
        context: [ssn, identificatie, identifier, identificatienummer]
