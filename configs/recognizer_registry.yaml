# Recognizer registry, standalone form.
#
# UNUSED at runtime. Both compose files set ANALYZER_CONF_FILE, and a unified
# config that carries its own `recognizer_registry` block takes precedence over
# RECOGNIZER_REGISTRY_CONF_FILE. Editing this file changes nothing until that
# variable is removed. The live copy of this block is in configs/analyzer.yaml.
#
# It is kept as the fallback for running the analyzer with
# RECOGNIZER_REGISTRY_CONF_FILE alone, and mirrors the `recognizer_registry`
# block in analyzer.yaml with the two top-level keys that file inherits from its
# own header. If you change one, change both, or delete this file.

supported_languages:
  - en
  - nl

# Results below this score are dropped. Recognizers are tuned around it: a
# pattern scored under 0.6 only surfaces once the context enhancer adds its
# +0.35 bonus for a nearby context word.
default_score_threshold: 0.6

# re.IGNORECASE | re.MULTILINE | re.DOTALL, applied to every pattern below.
# Patterns that need real case sensitivity have to scope it back off with
# (?-i:...), which NlPostcodeRecognizer does.
global_regex_flags: 26

recognizers:

  # --- Model-driven -----------------------------------------------

  # Wraps the spaCy models. This is what finds PERSON, LOCATION, ORGANIZATION
  # and DATE_TIME. Everything below it is regex or checksum work.
  - name: SpacyRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
    enabled: true

  # --- Locale-agnostic --------------------------------------------
  # Formats that look the same in both languages.

  - name: CreditCardRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: CryptoRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  # Matches separator-based dates such as 31-12-2024 and 12/31/2024. Dutch
  # day-first ordering is already covered. Dates written out in words are
  # caught by spaCy instead.
  - name: DateRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: EmailRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  # Validates the IBAN checksum, so Dutch NL.. accounts are handled without any
  # extra configuration.
  - name: IbanRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: IpRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  # Scores every match at a flat 0.4, which sits under the 0.6 threshold, so
  # until the override below a phone number was only reported when a word like
  # "phone" or "telefoon" happened to sit beside it. PHONE_NUMBER is admitted at
  # 0.4 instead. NlPhoneRecognizer uses the same figure.
  #
  # Its region list (US, GB, DE, FR, IL, IN, CA, BR) contains no NL and cannot be
  # changed from here: Presidio validates each recognizer entry against a pydantic
  # model that discards unknown keys, so a supported_regions field is dropped
  # without a warning. +31 numbers are still found, because an explicit country
  # code needs no region hint. Dutch national formats are NlPhoneRecognizer's job.
  - name: PhoneRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
    score_thresholds:
      PHONE_NUMBER: 0.4
  - name: UrlRecognizer
    supported_languages:
      - en
      - nl
    type: predefined
  - name: MacAddressRecognizer
    supported_languages:
      - en
      - nl
    type: predefined

  # --- Dutch ------------------------------------------------------
  # Presidio ships country packs for a dozen countries but not for the
  # Netherlands, so the three below are defined here.

  # Burgerservicenummer, the Dutch national identity number. Nine digits with
  # no internal punctuation, which on its own is indistinguishable from an
  # order number, so the pattern is scored at 0.55 and stays under the 0.6
  # threshold until a context word lifts it to 0.90. The elfproef checksum
  # that would confirm a real BSN cannot be expressed as a regex; the context
  # requirement stands in for it.
  #
  # 0.55 rather than something lower because spaCy reads a bare digit run as a
  # date and reports DATE_TIME at 0.85 over the same span. Any lower and the
  # BSN still comes back from /analyze, but the anonymizer resolves the overlap
  # in favour of the higher score and writes <DATE_TIME> in its place.
  # Dutch national phone formats, which PhoneRecognizer cannot see without NL
  # in its region list. Covers 0612345678, 06-1234 5678, 020 794 5000 and the
  # +31 / 0031 / +31 (0) prefixes, with spaces, dots or hyphens between groups.
  # The shape is a trunk 0 or a +31 prefix followed by exactly nine more digits,
  # which is specific enough that a bare ten-digit number starting with 0 is the
  # only realistic false positive. Scored to match PhoneRecognizer.
  - name: NlPhoneRecognizer
    type: custom
    enabled: true
    supported_entity: PHONE_NUMBER
    score_thresholds:
      PHONE_NUMBER: 0.4
    patterns:
      - name: nl_phone
        regex: "(?<![\\w+])(?:(?:\\+|00)31[\\s.-]?(?:\\(0\\)[\\s.-]?)?|0)[1-9][\\s.-]?(?:\\d[\\s.-]?){7}\\d(?!\\d)"
        score: 0.4
    supported_languages:
      - language: nl
        context: [telefoon, telefoonnummer, mobiel, bellen, tel, gsm]
      - language: en
        context: [phone, telephone, mobile, cell, call, tel]

  - name: NlBsnRecognizer
    type: custom
    enabled: true
    supported_entity: NL_BSN
    patterns:
      - name: bsn_9digit
        regex: "\\b\\d{9}\\b"
        score: 0.55
    supported_languages:
      - language: nl
        context: [bsn, burgerservicenummer, sofinummer, burgerservice]
      - language: en
        context: [bsn, citizen, burgerservicenummer, sofinummer]

  # Dutch postcode, four digits then two letters, as in 1015 CJ. The first digit
  # cannot be zero. (?-i:[A-Z]{2}) turns off the global IGNORECASE for the
  # letter pair, which matters more than it looks: case-insensitively, "in 2015
  # in Amsterdam" matches the pattern via "2015 in".
  - name: NlPostcodeRecognizer
    type: custom
    enabled: true
    supported_entity: NL_POSTCODE
    patterns:
      - name: nl_postcode
        regex: "\\b[1-9]\\d{3}\\s?(?-i:[A-Z]{2})\\b"
        score: 0.6
    supported_languages:
      - language: nl
        context: [postcode, adres, woonachtig, straat, wonen]
      - language: en
        context: [postcode, postal, zip, address, street]

  # A whole Dutch address as one span, so the anonymizer emits a single
  # placeholder instead of one per component. Presidio never merges adjacent
  # entities of different types, and the anonymizer resolves an overlap by
  # keeping the containing span, so matching the full address in one go is the
  # only way to turn "Damrak 1, 1012 LH Amsterdam" into one placeholder.
  #
  # nl_address_full anchors on the postcode: street name, house number,
  # postcode, then an optional city and country. The postcode is what makes it
  # safe to score at 0.85 and fire without context, since "Boeing 747" and
  # "Chapter 12" share the street-plus-number shape but never carry one.
  #
  # nl_street is the fallback for an address written without a postcode. It
  # requires a recognisable Dutch street ending (straat, laan, gracht and the
  # rest) and scores 0.4, under the threshold, so it only surfaces next to a
  # word like "adres" or "address". A street name with no such ending and no
  # postcode, "Damrak 1" on its own, stays undetected on purpose.
  - name: NlAddressRecognizer
    type: custom
    enabled: true
    supported_entity: NL_ADDRESS
    patterns:
      - name: nl_address_full
        regex: "\\b(?:'s-)?(?-i:[A-Z][a-zA-Z'\u2019-]+)(?:\\s+(?:(?:van|de|den|der|ter)\\s+)?(?:'s-)?(?-i:[A-Z][a-zA-Z'\u2019-]+)){0,2}\\s+(?:nr\\.?\\s*)?\\d{1,5}(?:\\s?[-/]\\s?\\d{1,5})?(?:\\s?(?:bis|hs|[a-zA-Z])\\b)?\\s*,?\\s*[1-9]\\d{3}\\s?(?-i:[A-Z]{2})(?:\\s*,?\\s*(?:'s-)?(?-i:[A-Z][a-zA-Z'\u2019-]+)(?:\\s+(?:(?:van|de|den|der|ter)\\s+)?(?:'s-)?(?-i:[A-Z][a-zA-Z'\u2019-]+)){0,2})?(?:\\s*,?\\s*(?:Nederland|Netherlands|Holland))?"
        score: 0.85
      - name: nl_street
        regex: "\\b(?:(?:van|de|den|der|ter)\\s+)?(?-i:[A-Z])[a-zA-Z'\u2019-]*(?:straat|laan|weg|plein|gracht|kade|dijk|singel|hof|park|steeg|baan|dreef|pad|markt|wal|boulevard|erf|hoek|kwartier)\\s+(?:nr\\.?\\s*)?\\d{1,5}(?:\\s?[-/]\\s?\\d{1,5})?(?:\\s?(?:bis|hs|[a-zA-Z])\\b)?"
        score: 0.4
    supported_languages:
      - language: nl
        context: [adres, postadres, bezoekadres, woonachtig, woont, wonen, straat, huisnummer]
      - language: en
        context: [address, street, live, lives, living, residence, home]

  # --- US-specific ------------------------------------------------
  # Registered for English only. Dutch text runs without them, which is what
  # keeps US identifier patterns from firing on Dutch reference numbers.

  - name: UsSsnRecognizer
    supported_languages:
      - en
    type: predefined
  - name: UsBankRecognizer
    supported_languages:
      - en
    type: predefined
  - name: UsPassportRecognizer
    supported_languages:
      - en
    type: predefined
  - name: UsLicenseRecognizer
    supported_languages:
      - en
    type: predefined
  - name: MedicalLicenseRecognizer
    supported_languages:
      - en
    type: predefined
  - name: NhsRecognizer
    supported_languages:
      - en
    type: predefined
  - name: UsItinRecognizer
    supported_languages:
      - en
    type: predefined

  # --- Custom -----------------------------------------------------

  # The bundled UsSsnRecognizer requires supporting context and skips some
  # formats. This one takes the dashed form on its own at 0.6, matching the
  # threshold exactly, so a bare 123-45-6789 is still reported.
  - name: LooseSsnRecognizer
    type: custom
    enabled: true
    supported_entity: US_SSN
    patterns:
      - name: ssn_dashed
        regex: "(\\b\\d{3}-\\d{2}-\\d{4}\\b)"
        score: 0.6
    supported_languages:
      - language: en
        context: [ssn, social, identification, identifier]
      - language: nl
        context: [ssn, identificatie, identifier, identificatienummer]
