# Presidio gateway.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf. Kept as a real file
# rather than inlined in compose: Docker Compose interpolates $variables in
# compose values, which strips every nginx variable and makes `nginx -t` fail.

# Docker's embedded DNS. Combined with a variable in proxy_pass below, this
# makes nginx re-resolve backends per request instead of caching the IP from
# boot time, so a redeployed backend container is picked up automatically.
resolver 127.0.0.11 valid=10s ipv6=off;

# Traefik terminates TLS in front of us, so trust its X-Forwarded-Proto when
# present and fall back to our own scheme otherwise.
map $http_x_forwarded_proto $forwarded_scheme {
  default $http_x_forwarded_proto;
  ""      $scheme;
}


# ======================================================
# Analyzer
#
# https://presidio-analyzer.getdialog.dev
# ======================================================

server {
  listen 8080;
  server_name presidio-analyzer.getdialog.dev;

  client_max_body_size 100m;

  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  set $upstream_analyzer presidio-analyzer;

  location / {
    proxy_pass http://$upstream_analyzer:3000;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;

    proxy_set_header Connection "";
  }
}


