# ======================================================
# Default server
# ======================================================

server {
  listen 8080 default_server;
  server_name _;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    return 404;
  }
}
