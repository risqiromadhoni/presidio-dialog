# Local development stack.
#
# Mirrors docker-compose-prod.yaml minus the nginx gateway. Because there is no
# gateway here, each service publishes a host port instead of using `expose` on
# the shared `dokploy-network`, and configs/ is bind-mounted so YAML edits apply
# without a rebuild.
name: presidio

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
  interval: 15s
  timeout: 5s
  retries: 10

services:

  # ============================================================
  # Presidio Analyzer
  #
  # Built from Dockerfile so both spaCy models (en_core_web_lg and
  # nl_core_news_lg) are baked into the image. configs/ is mounted over the
  # baked copies so local YAML edits take effect on restart, not rebuild.
  # ============================================================
  presidio-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/presidio-analyzer:2.2.364-en-nl

    ports:
      - "5001:3000"

    volumes:
      - ./configs/analyzer.yaml:/app/analyzer.yaml
      - ./configs/nlp_engine.yaml:/app/nlp_engine.yaml
      - ./configs/recognizer_registry.yaml:/app/recognizer_registry.yaml

    environment:
      PORT: 3000
      # Prod runs 2. Each worker loads its own copy of both lg models
      # (~1.5 GB RSS), so a dev machine running three services stays at 1.
      WORKERS: 1
      # Unified config: nlp_configuration + recognizer_registry live in this
      # one file and take precedence over NLP_CONF_FILE / REGISTRY_CONF_FILE.
      ANALYZER_CONF_FILE: /app/analyzer.yaml
      NLP_CONF_FILE: /app/nlp_engine.yaml
      RECOGNIZER_REGISTRY_CONF_FILE: /app/recognizer_registry.yaml

    healthcheck:
      <<: *app-healthcheck
      # Loading both lg models takes a while on a cold start.
      start_period: 180s

    restart: unless-stopped
    logging: *logging


  # ============================================================
  # Presidio Anonymizer
  # ============================================================
  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364@sha256:e567013893ebc80994e3799f6f55c86aa1f0b0fadb779571ab346f0ec45365c1

    ports:
      - "5002:3000"

    environment:
      PORT: 3000
      WORKERS: 1

    healthcheck:
      <<: *app-healthcheck
      start_period: 60s

    restart: unless-stopped
    logging: *logging


  # ============================================================
  # Presidio Image Redactor
  #
  # OCR + Presidio Analyzer + Image Redaction.
  # Pinned by digest: this repository only publishes a :latest tag.
  # ============================================================
  presidio-image-redactor:
    image: ghcr.io/data-privacy-stack/presidio-image-redactor:latest@sha256:1a54ed9e9fb49131afd174203e6c0f023e3214f53798198bace799121adc2a24

    ports:
      - "5003:3000"

    environment:
      PORT: 3000
      WORKERS: 1

    healthcheck:
      <<: *app-healthcheck
      start_period: 120s

    restart: unless-stopped
    logging: *logging
